<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[디자인 목업] 맛집 담기 — place-search 참고용</title>
<style>
  /*
    이 파일은 시각 참고용 정적 목업입니다. 실제 기능(카카오 로컬 API 검색 등)은
    구현하지 않습니다. logic 팀의 place-search.html 구현 시 카드 컴포넌트/토큰
    참고 자료로만 사용하세요. 자세한 스펙은 place-search-design-spec.md 참고.
  */
  @font-face {
    font-family: 'HakgyoansimDunggeunmiso';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'MitmiFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/Ownglyph_meetme-Rg.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  @import url('https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css');

  :root {
    --cream: #FEEAC9;
    --pink: #FDACAC;
    --coral: #FD7979;
    --warmgray: #4A3F3B;

    --surface: #FFFFFF;
    --hairline: rgba(74, 63, 59, 0.10);
    --muted: rgba(74, 63, 59, 0.72);
    --faint: rgba(74, 63, 59, 0.52);

    --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

    --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px;

    --shadow-sm: 0 1px 3px rgba(74, 63, 59, 0.08), 0 1px 2px rgba(74, 63, 59, 0.05);
    --shadow-md: 0 10px 24px -10px rgba(74, 63, 59, 0.18);
    --shadow-accent: 0 20px 40px -16px rgba(253, 121, 121, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Wanted Sans Variable', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--warmgray);
  }

  .heading { font-family: 'MitmiFont', 'Wanted Sans Variable', sans-serif; font-weight: 400; }
  .logo { font-family: 'HakgyoansimDunggeunmiso', 'Wanted Sans Variable', sans-serif; font-weight: 700; text-decoration: none; color: var(--warmgray); }

  .container { width: 100%; margin-inline: auto; padding-inline: 20px; }
  @media (min-width: 768px) { .container { padding-inline: 40px; } }
  @media (min-width: 1440px) { .container { max-width: 1120px; padding-inline: 40px; } }

  /* ---------- Nav (index.html과 동일한 언어) ---------- */
  .nav { position: sticky; top: 0; z-index: 20; background: rgba(254,234,201,.9); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--hairline); padding-block: 14px; }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; }
  .nav-logo { font-size: 20px; }
  .nav-logo span { color: var(--coral); }
  .nav-back { font-size: 13.5px; font-weight: 600; color: var(--muted); text-decoration: none; }

  /* ---------- Page header ---------- */
  .page-head { padding-block: var(--sp-6) var(--sp-5); }
  .page-head .eyebrow { color: var(--coral); font-weight: 700; font-size: 13px; letter-spacing: .06em; margin-bottom: 8px; }
  .page-head h1 { font-size: clamp(22px, 5vw, 30px); }

  /* ---------- Search bar ---------- */
  .search-wrap { padding-bottom: var(--sp-5); }
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border-radius: var(--r-sm);
    box-shadow: var(--shadow-sm);
    height: 48px; padding-inline: 16px;
    border: 1.5px solid transparent;
    transition: border-color .2s ease, box-shadow .2s ease;
    max-width: 640px;
  }
  .search-bar:focus-within { border-color: var(--coral); box-shadow: var(--shadow-accent); }
  .search-bar input { border: none; outline: none; font: inherit; font-size: 14.5px; flex: 1; background: transparent; color: var(--warmgray); }
  .search-bar input::placeholder { color: var(--faint); }
  .search-icon { font-size: 16px; opacity: .7; }

  .chip-row { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    background: var(--surface); border: 1.5px solid var(--pink); color: var(--warmgray);
    border-radius: var(--r-sm); padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .chip:hover { transform: translateY(-2px); }
  .chip.active { background: var(--coral); border-color: var(--coral); color: #fff; }

  /* ---------- Result meta ---------- */
  .result-meta { font-size: 13px; color: var(--muted); padding-bottom: var(--sp-4); }
  .result-meta b { color: var(--warmgray); }

  /* ---------- Card grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; padding-bottom: var(--sp-7); }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; } }
  @media (min-width: 1440px) { .grid { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 24px; } }

  /* ---------- Place card ---------- */
  .place-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    padding: 20px;
    transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
  }
  @media (min-width: 768px) { .place-card { padding: 24px; } }

  .place-card:hover { box-shadow: var(--shadow-accent); border-color: transparent; transform: translateY(-4px); }
  .place-card.is-saved { border-color: var(--coral); border-width: 1.5px; }

  .place-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: var(--sp-4); }
  .place-card__icon { width: 40px; height: 40px; border-radius: var(--r-md); background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }

  .place-card__save-btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 13px;
    border-radius: var(--r-sm); padding: 8px 14px; white-space: nowrap;
    background: var(--coral); color: #fff;
    transition: background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .place-card__save-btn:hover { box-shadow: var(--shadow-accent); }
  .place-card__save-btn[data-state="saved"] {
    background: #fff; color: var(--coral); border: 1.5px solid var(--pink); box-shadow: none;
  }
  .place-card__save-btn[data-state="saved"]:hover { background: var(--pink); color: var(--warmgray); border-color: var(--pink); }

  .place-card__name { font-size: 17px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .place-card__meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .place-card__address { font-size: 13px; color: var(--faint); margin-bottom: 0; }
  .place-card__tags { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .place-card__tags .tag {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: var(--r-sm);
    background: var(--cream); color: var(--warmgray);
  }

  /* ---------- Skeleton ---------- */
  .place-card.is-skeleton { display: flex; flex-direction: column; gap: 10px; }
  .sk-block { border-radius: 8px; background: linear-gradient(90deg, var(--cream) 25%, #fff6e6 37%, var(--cream) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  .sk-icon { width: 40px; height: 40px; border-radius: var(--r-md); }
  .sk-line { height: 12px; }
  .sk-line.w60 { width: 60%; }
  .sk-line.w40 { width: 40%; }
  .sk-line.w80 { width: 80%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  /* ---------- Empty state ---------- */
  .empty-state {
    grid-column: 1 / -1;
    background: var(--pink);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    padding: 48px 24px;
    text-align: center;
  }
  .empty-state .icon { font-size: 28px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 6px; }
  .empty-state p { font-size: 13.5px; color: var(--muted); }

  .section-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--faint); text-transform: uppercase; margin: var(--sp-6) 0 var(--sp-3); }
</style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner container">
      <a class="nav-logo logo" href="index.html">여기<span>찜</span></a>
      <a class="nav-back" href="index.html">← 홈으로</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-head">
      <p class="eyebrow">PLACE SEARCH — 디자인 목업</p>
      <h1 class="heading">어떤 맛집을 담아볼까요?</h1>
    </div>

    <div class="search-wrap">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="맛집 이름이나 지역으로 검색해보세요" value="합정 파스타">
      </div>
      <div class="chip-row">
        <span class="chip active">전체</span>
        <span class="chip">한식</span>
        <span class="chip">카페</span>
        <span class="chip">술집</span>
        <span class="chip">일식</span>
        <span class="chip">양식</span>
      </div>
    </div>

    <p class="result-meta"><b>12개</b>의 검색 결과가 있어요</p>

    <div class="grid">
      <!-- 기본 카드 -->
      <div class="place-card">
        <div class="place-card__top">
          <span class="place-card__icon">🍝</span>
          <button class="place-card__save-btn" data-state="default" onclick="toggleSave(this)">+ 담기</button>
        </div>
        <h3 class="place-card__name">홍대파스타집</h3>
        <p class="place-card__meta">양식 · 도보 6분</p>
        <p class="place-card__address">📍 서울 마포구 양화로 45</p>
      </div>

      <!-- 담긴 카드 -->
      <div class="place-card is-saved">
        <div class="place-card__top">
          <span class="place-card__icon">☕</span>
          <button class="place-card__save-btn" data-state="saved" onclick="toggleSave(this)">✓ 담았어요</button>
        </div>
        <h3 class="place-card__name">모카책방</h3>
        <p class="place-card__meta">카페 · 도보 3분</p>
        <p class="place-card__address">📍 서울 마포구 월드컵로 12</p>
        <div class="place-card__tags">
          <span class="tag">카공</span>
          <span class="tag">혼밥</span>
        </div>
      </div>

      <!-- 기본 카드 2 -->
      <div class="place-card">
        <div class="place-card__top">
          <span class="place-card__icon">🍢</span>
          <button class="place-card__save-btn" data-state="default" onclick="toggleSave(this)">+ 담기</button>
        </div>
        <h3 class="place-card__name">연남 이자카야 별관점</h3>
        <p class="place-card__meta">술집 · 도보 9분</p>
        <p class="place-card__address">📍 서울 마포구 성미산로 21</p>
      </div>

      <!-- 스켈레톤 로딩 카드 -->
      <div class="place-card is-skeleton">
        <div class="place-card__top">
          <div class="sk-block sk-icon"></div>
        </div>
        <div class="sk-block sk-line w60"></div>
        <div class="sk-block sk-line w40"></div>
        <div class="sk-block sk-line w80"></div>
      </div>
    </div>

    <p class="section-label">빈 상태 (검색 결과 없음) 참고</p>
    <div class="grid">
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3 class="heading">검색 결과가 없어요</h3>
        <p>다른 키워드나 지역으로 다시 찾아볼까요?</p>
      </div>
    </div>
  </main>

  <script>
    // 시각 참고용 인터랙션 데모일 뿐, 실제 저장 로직은 없습니다.
    function toggleSave(btn) {
      const card = btn.closest('.place-card');
      const saved = btn.dataset.state === 'saved';
      btn.dataset.state = saved ? 'default' : 'saved';
      btn.textContent = saved ? '+ 담기' : '✓ 담았어요';
      card.classList.toggle('is-saved', !saved);
    }
  </script>

</body>
</html>
