<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맛집 담기 — 여기찜</title>
<style>
  @font-face {
    font-family: 'HakgyoansimDunggeunmiso';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'MitmiFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/Ownglyph_meetme-Rg.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  @import url('https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css');

  :root {
    --cream: #FEEAC9;
    --pink: #FDACAC;
    --coral: #FD7979;
    --warmgray: #4A3F3B;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Wanted Sans Variable', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--warmgray);
    min-height: 100vh;
  }

  .heading {
    font-family: 'MitmiFont', 'Wanted Sans Variable', sans-serif;
    font-weight: 400;
  }

  a { color: inherit; }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: #fffdf9cc;
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar .logo {
    font-family: 'HakgyoansimDunggeunmiso', 'Wanted Sans Variable', sans-serif;
    font-weight: 700;
    font-size: 22px;
    text-decoration: none;
    color: var(--warmgray);
  }

  .topbar .logo span { color: var(--coral); }

  /* ---------- Main layout ---------- */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .page-title {
    font-size: clamp(26px, 6vw, 34px);
    margin-bottom: 8px;
  }

  .page-desc {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  /* ---------- Search panel ---------- */
  .search-panel {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: 0 12px 30px -20px rgba(74, 63, 59, 0.35);
    margin-bottom: 28px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: var(--cream);
    padding: 6px;
    border-radius: var(--radius-md);
    margin-bottom: 18px;
  }

  .tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--warmgray);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tab.active {
    background: var(--coral);
    color: #fff;
  }

  .search-form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .search-form input[type="text"] {
    flex: 1 1 220px;
    min-width: 0;
    font-family: inherit;
    font-size: 15px;
    padding: 12px 16px;
    border: 1.5px solid var(--pink);
    border-radius: var(--radius-md);
    background: var(--cream);
    color: var(--warmgray);
    outline: none;
  }

  .search-form input[type="text"]:focus {
    border-color: var(--coral);
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius-md);
    padding: 12px 20px;
    cursor: pointer;
    background: var(--coral);
    color: #fff;
    transition: transform 0.2s ease, opacity 0.2s ease;
    white-space: nowrap;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  #categoryForm {
    flex-direction: column;
    align-items: flex-start;
  }

  #categoryForm p {
    font-size: 14px;
    opacity: 0.85;
  }

  #locateStatus {
    font-size: 13px;
    color: var(--coral);
    font-weight: 600;
  }

  .key-warning {
    margin-top: 14px;
    background: var(--cream);
    border: 1.5px dashed var(--coral);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--warmgray);
  }

  .key-warning code {
    background: #fff;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 12px;
  }

  /* ---------- Results ---------- */
  .result-meta {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.75;
    margin-bottom: 14px;
    min-height: 18px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .place-card {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: 0 10px 26px -20px rgba(74, 63, 59, 0.4);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .place-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 32px -18px rgba(253, 121, 121, 0.4);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .category-chip {
    background: var(--pink);
    color: var(--warmgray);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
  }

  .save-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    border: 1.5px solid var(--coral);
    background: #fff;
    color: var(--coral);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .save-btn:hover { background: var(--coral); color: #fff; }

  .save-btn.saved {
    background: var(--coral);
    color: #fff;
  }

  .place-name {
    font-size: 17px;
    font-weight: 700;
  }

  .place-address {
    font-size: 13.5px;
    opacity: 0.85;
  }

  .place-category {
    font-size: 12.5px;
    opacity: 0.6;
  }

  .card-footer {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    border-top: 1px solid var(--cream);
    padding-top: 10px;
  }

  .place-phone { opacity: 0.75; }

  .place-link {
    text-decoration: none;
    font-weight: 700;
    color: var(--coral);
  }

  .place-link:hover { text-decoration: underline; }

  #loadMoreBtn {
    display: block;
    margin: 24px auto 0;
    background: #fff;
    color: var(--coral);
    border: 1.5px solid var(--coral);
  }

  #loadMoreBtn:hover { background: var(--coral); color: #fff; }

  .state-msg {
    text-align: center;
    padding: 48px 20px;
    font-size: 14px;
    opacity: 0.7;
    background: #fff;
    border-radius: var(--radius-lg);
  }

  #errorState { color: var(--coral); opacity: 1; font-weight: 600; }

  /* ---------- Tablet (>=768px) ---------- */
  @media (min-width: 768px) {
    main { padding: 32px 32px 100px; }

    .search-panel { padding: 26px 28px; }

    .tabs { max-width: 420px; }

    .card-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
  }

  /* ---------- Desktop (>=1440px) ---------- */
  @media (min-width: 1440px) {
    main { padding: 40px 0 120px; }

    .card-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html">여기<span>찜</span></a>
  </header>

  <main>
    <h1 class="page-title heading">맛집 담기</h1>
    <p class="page-desc">카카오 로컬 API로 검색해서 마음에 드는 맛집을 담아보세요.<br>담은 곳은 이 브라우저에 임시로 저장돼요.</p>

    <section class="search-panel">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="keyword">키워드 검색</button>
        <button type="button" class="tab" data-mode="category">카테고리 검색 (음식점)</button>
      </div>

      <form class="search-form" id="keywordForm">
        <input type="text" id="keywordInput" placeholder="가게 이름, 지역+음식 등으로 검색 (예: 강남 파스타)" autocomplete="off">
        <label class="checkbox-label"><input type="checkbox" id="onlyFood"> 음식점만 보기</label>
        <button type="submit" class="btn" id="keywordSearchBtn">검색</button>
      </form>

      <div class="search-form" id="categoryForm" hidden>
        <p>내 위치 근처 2km 이내 음식점을 거리순으로 찾아드려요.</p>
        <button type="button" class="btn" id="locateBtn">내 위치에서 음식점 찾기</button>
        <span id="locateStatus"></span>
      </div>

      <p class="key-warning" id="keyWarning" hidden>
        ⚠️ 카카오 REST API 키가 설정되지 않았어요. <code>config.example.js</code>를
        <code>config.js</code>로 복사한 뒤 발급받은 키를 채우고 검색해주세요.
      </p>
    </section>

    <section class="results">
      <p class="result-meta" id="resultMeta"></p>
      <div class="card-grid" id="cardGrid"></div>
      <p class="state-msg" id="emptyState" hidden>검색 결과가 없어요. 다른 키워드로 시도해보세요.</p>
      <p class="state-msg" id="errorState" hidden></p>
      <button type="button" class="btn" id="loadMoreBtn" hidden>더 보기</button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="place-search.js"></script>
</body>
</html>
