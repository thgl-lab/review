<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맛집 담기 — 여기찜</title>
<style>
  @font-face {
    font-family: 'HakgyoansimDunggeunmiso';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'MitmiFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/Ownglyph_meetme-Rg.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  @import url('https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css');

  :root {
    --cream: #FEEAC9;
    --pink: #FDACAC;
    --coral: #FD7979;
    --warmgray: #4A3F3B;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Wanted Sans Variable', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--warmgray);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .heading {
    font-family: 'MitmiFont', 'Wanted Sans Variable', sans-serif;
    font-weight: 400;
  }

  a { color: inherit; }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: rgba(254, 234, 201, 0.88);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar .logo {
    font-family: 'HakgyoansimDunggeunmiso', 'Wanted Sans Variable', sans-serif;
    font-weight: 700;
    font-size: 22px;
    text-decoration: none;
    color: var(--warmgray);
  }

  .topbar .logo span { color: var(--coral); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .topbar-nav-link {
    display: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 13.5px;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    text-decoration: none;
    white-space: nowrap;
    transition: transform 0.22s ease;
  }

  .topbar-nav-link:hover { transform: translateY(-2px); }
  .topbar-nav-link[hidden] { display: none; }

  .topbar-nav-link.secondary {
    background: var(--pink);
    color: var(--warmgray);
  }

  /* ---------- 모바일 하단 탭바 ---------- */
  .bottom-tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: flex;
    align-items: stretch;
    background: #fff;
    border-top: 1px solid rgba(74, 63, 59, 0.1);
    box-shadow: 0 -4px 16px rgba(74, 63, 59, 0.08);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 64px;
    padding: 10px 4px;
    text-decoration: none;
    color: var(--warmgray);
    font-size: 11px;
    font-weight: 600;
    position: relative;
  }

  .tab-item svg { display: block; }

  .tab-item[hidden] { display: none; }

  .tab-item.active { color: var(--coral); font-weight: 700; }

  .tab-item.active::before {
    content: '';
    position: absolute;
    top: 0;
    width: 28px;
    height: 3px;
    border-radius: 3px;
    background: var(--coral);
  }

  /* ---------- Main layout ---------- */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .page-title {
    font-size: clamp(26px, 6vw, 34px);
    margin-bottom: 8px;
  }

  .page-desc {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  /* ---------- Search panel ---------- */
  .search-panel {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: 0 12px 30px -20px rgba(74, 63, 59, 0.35);
    margin-bottom: 28px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: var(--cream);
    padding: 6px;
    border-radius: var(--radius-md);
    margin-bottom: 18px;
  }

  .tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--warmgray);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tab.active {
    background: var(--coral);
    color: #fff;
  }

  .search-form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .search-form input[type="text"] {
    flex: 1 1 220px;
    min-width: 0;
    font-family: inherit;
    font-size: 15px;
    padding: 12px 16px;
    border: 1.5px solid var(--pink);
    border-radius: var(--radius-md);
    background: var(--cream);
    color: var(--warmgray);
    outline: none;
  }

  .search-form input[type="text"]:focus {
    border-color: var(--coral);
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius-md);
    padding: 12px 20px;
    cursor: pointer;
    background: var(--coral);
    color: #fff;
    transition: transform 0.2s ease, opacity 0.2s ease;
    white-space: nowrap;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  #categoryForm {
    flex-direction: column;
    align-items: flex-start;
  }

  #categoryForm p {
    font-size: 14px;
    opacity: 0.85;
  }

  #locateStatus {
    font-size: 13px;
    color: var(--coral);
    font-weight: 600;
  }

  .key-warning {
    margin-top: 14px;
    background: var(--cream);
    border: 1.5px dashed var(--coral);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--warmgray);
  }

  .key-warning code {
    background: #fff;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 12px;
  }

  /* ---------- Results ---------- */
  .result-meta {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.75;
    margin-bottom: 14px;
    min-height: 18px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .place-card {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: 0 10px 26px -20px rgba(74, 63, 59, 0.4);
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .place-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 32px -18px rgba(253, 121, 121, 0.4);
  }

  .card-photo {
    position: relative;
    margin: -18px -18px 4px;
    aspect-ratio: 4 / 3;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    overflow: hidden;
    background: linear-gradient(135deg, var(--pink), var(--cream));
  }

  .photo-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .card-photo.loaded .photo-fallback {
    display: none;
  }

  .place-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .place-photo[hidden] {
    display: none;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .category-chip {
    background: var(--pink);
    color: var(--warmgray);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
  }

  .save-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    border: 1.5px solid var(--coral);
    background: #fff;
    color: var(--coral);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .save-btn:hover { background: var(--coral); color: #fff; }

  .save-btn.saved {
    background: var(--coral);
    color: #fff;
  }

  .place-name {
    font-size: 17px;
    font-weight: 700;
  }

  .place-address {
    font-size: 13.5px;
    opacity: 0.85;
  }

  .place-category {
    font-size: 12.5px;
    opacity: 0.6;
  }

  .card-footer {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    border-top: 1px solid var(--cream);
    padding-top: 10px;
  }

  .place-phone { opacity: 0.75; }

  .place-link {
    text-decoration: none;
    font-weight: 700;
    color: var(--coral);
  }

  .place-link:hover { text-decoration: underline; }

  /* ---------- 구글 리뷰 패널 ---------- */
  .review-hint {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--coral);
    text-align: center;
  }

  .review-panel {
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--cream);
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: default;
  }

  .review-loading,
  .review-empty {
    font-size: 13px;
    opacity: 0.75;
    text-align: center;
    padding: 10px 0;
  }

  .review-place-name {
    font-size: 15px;
    font-weight: 700;
  }

  .review-summary {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.85;
  }

  .review-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 320px;
    overflow-y: auto;
  }

  .review-item {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .review-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
  }

  .review-author {
    font-size: 13px;
    font-weight: 700;
  }

  .review-stars {
    font-size: 11px;
    white-space: nowrap;
  }

  .review-time {
    font-size: 11.5px;
    opacity: 0.6;
    margin-bottom: 4px;
  }

  .review-text {
    font-size: 13px;
    line-height: 1.5;
  }

  .review-maps-link {
    align-self: flex-start;
    font-size: 13px;
    font-weight: 700;
    color: var(--coral);
    text-decoration: none;
  }

  .review-maps-link:hover { text-decoration: underline; }

  /* ---------- AI 리뷰 분석 ---------- */
  .ai-analysis {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--pink);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ai-section-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--coral);
  }

  .ai-loading,
  .ai-error {
    font-size: 13px;
    opacity: 0.75;
    text-align: center;
    padding: 10px 0;
  }

  .sentiment-bar {
    display: flex;
    width: 100%;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--cream);
  }

  .sentiment-segment { height: 100%; }
  .sentiment-segment.positive { background: #4caf7d; }
  .sentiment-segment.neutral { background: #f5c242; }
  .sentiment-segment.negative { background: #e0554f; }

  .sentiment-legend {
    display: flex;
    gap: 14px;
    font-size: 12px;
    font-weight: 600;
  }

  .legend-item { display: flex; align-items: center; gap: 5px; }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .legend-dot.positive { background: #4caf7d; }
  .legend-dot.neutral { background: #f5c242; }
  .legend-dot.negative { background: #e0554f; }

  .wordcloud-wrap {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 4px;
  }

  .wordcloud-canvas {
    display: block;
    width: 100%;
    height: 200px;
  }

  .wordcloud-fallback {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 14px;
  }

  .wordcloud-tag { font-weight: 700; }

  .ai-summary-bubble {
    position: relative;
    background: #fff;
    border: 1.5px solid var(--pink);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.6;
    font-weight: 600;
  }

  .ai-summary-bubble::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 20px;
    width: 14px;
    height: 14px;
    background: #fff;
    border-left: 1.5px solid var(--pink);
    border-top: 1.5px solid var(--pink);
    transform: rotate(45deg);
  }

  #loadMoreBtn {
    display: block;
    margin: 24px auto 0;
    background: #fff;
    color: var(--coral);
    border: 1.5px solid var(--coral);
  }

  #loadMoreBtn:hover { background: var(--coral); color: #fff; }

  .state-msg {
    text-align: center;
    padding: 48px 20px;
    font-size: 14px;
    opacity: 0.7;
    background: #fff;
    border-radius: var(--radius-lg);
  }

  #errorState { color: var(--coral); opacity: 1; font-weight: 600; }

  /* ---------- Tablet (>=768px) ---------- */
  @media (min-width: 768px) {
    body { padding-bottom: 0; }
    .topbar-nav-link { display: inline-flex; align-items: center; }
    .bottom-tabbar { display: none; }

    main { padding: 32px 32px 100px; }

    .search-panel { padding: 26px 28px; }

    .tabs { max-width: 420px; }

    .card-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
  }

  /* ---------- Desktop (>=1440px) ---------- */
  @media (min-width: 1440px) {
    main { padding: 40px 0 120px; }

    .card-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html">여기<span>찜</span></a>
    <div class="topbar-right">
      <div id="authArea"></div>
      <a class="topbar-nav-link secondary auth-required-link" href="Mypage.html" hidden>맛집주머니</a>
    </div>
  </header>

  <nav class="bottom-tabbar" aria-label="주요 기능 바로가기">
    <a class="tab-item" href="index.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>홈</span>
    </a>
    <a class="tab-item active" href="place-search.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>맛집 검색</span>
    </a>
    <a class="tab-item auth-required-link" href="Mypage.html" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.8-3-9-6.4-9-10.5C3 7.2 5.2 5 8 5c1.7 0 3.2.9 4 2.3C12.8 5.9 14.3 5 16 5c2.8 0 5 2.2 5 5.5 0 4.1-4.2 7.5-9 10.5z"/></svg>
      <span>맛집주머니</span>
    </a>
  </nav>

  <main>
    <h1 class="page-title heading">맛집 담기</h1>
    <p class="page-desc">카카오 로컬 API로 검색해서 마음에 드는 맛집을 담아보세요.<br>담은 곳은 로그인 계정에 저장돼요.</p>

    <section class="search-panel">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="keyword">키워드 검색</button>
        <button type="button" class="tab" data-mode="category">카테고리 검색 (음식점)</button>
      </div>

      <form class="search-form" id="keywordForm">
        <input type="text" id="keywordInput" placeholder="가게 이름, 지역+음식 등으로 검색 (예: 강남 파스타)" autocomplete="off">
        <label class="checkbox-label"><input type="checkbox" id="onlyFood"> 음식점만 보기</label>
        <button type="submit" class="btn" id="keywordSearchBtn">검색</button>
      </form>

      <div class="search-form" id="categoryForm" hidden>
        <p>내 위치 근처 2km 이내 음식점을 거리순으로 찾아드려요.</p>
        <button type="button" class="btn" id="locateBtn">내 위치에서 음식점 찾기</button>
        <span id="locateStatus"></span>
      </div>

      <p class="key-warning" id="keyWarning" hidden>
        ⚠️ 카카오 REST API 키가 설정되지 않았어요. <code>config.example.js</code>를
        <code>config.js</code>로 복사한 뒤 발급받은 키를 채우고 검색해주세요.
      </p>
    </section>

    <section class="results">
      <p class="result-meta" id="resultMeta"></p>
      <div class="card-grid" id="cardGrid"></div>
      <p class="state-msg" id="emptyState" hidden>검색 결과가 없어요. 다른 키워드로 시도해보세요.</p>
      <p class="state-msg" id="errorState" hidden></p>
      <button type="button" class="btn" id="loadMoreBtn" hidden>더 보기</button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="auth-nav-toggle.js"></script>
  <script src="saved-places-store.js"></script>
  <script src="situation-tags.js"></script>
  <script src="ui-modals.js"></script>
  <script src="save-flow.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
  <script src="gemini-analysis.js"></script>
  <script src="google-reviews.js"></script>
  <script src="place-search.js"></script>
</body>
</html>
