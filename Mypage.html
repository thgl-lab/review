<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맛집주머니 — 여기찜</title>
<style>
  @font-face {
    font-family: 'HakgyoansimDunggeunmiso';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimDunggeunmisoTTF-B.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'MitmiFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/Ownglyph_meetme-Rg.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  @import url('https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css');

  :root {
    --cream: #FEEAC9;
    --pink: #FDACAC;
    --coral: #FD7979;
    --warmgray: #4A3F3B;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Wanted Sans Variable', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--warmgray);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .heading {
    font-family: 'MitmiFont', 'Wanted Sans Variable', sans-serif;
    font-weight: 400;
  }

  a { color: inherit; }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: #fffdf9cc;
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar .logo {
    font-family: 'HakgyoansimDunggeunmiso', 'Wanted Sans Variable', sans-serif;
    font-weight: 700;
    font-size: 22px;
    text-decoration: none;
    color: var(--warmgray);
  }

  .topbar .logo span { color: var(--coral); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .topbar-nav-link {
    display: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 13.5px;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 1px 3px rgba(74, 63, 59, 0.08), 0 1px 2px rgba(74, 63, 59, 0.05);
    transition: transform 0.22s ease;
  }

  .topbar-nav-link:hover { transform: translateY(-2px); }
  .topbar-nav-link[hidden] { display: none; }

  .topbar-nav-link.primary {
    background: var(--coral);
    color: #fff;
  }

  /* ---------- 모바일 하단 탭바 ---------- */
  .bottom-tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: flex;
    align-items: stretch;
    background: #fff;
    border-top: 1px solid rgba(74, 63, 59, 0.1);
    box-shadow: 0 -4px 16px rgba(74, 63, 59, 0.08);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 64px;
    padding: 10px 4px;
    text-decoration: none;
    color: var(--warmgray);
    font-size: 11px;
    font-weight: 600;
    position: relative;
  }

  .tab-item svg { display: block; }

  .tab-item[hidden] { display: none; }

  .tab-item.active { color: var(--coral); font-weight: 700; }

  .tab-item.active::before {
    content: '';
    position: absolute;
    top: 0;
    width: 28px;
    height: 3px;
    border-radius: 3px;
    background: var(--coral);
  }

  /* ---------- Main layout ---------- */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .page-title {
    font-size: clamp(26px, 6vw, 34px);
    margin-bottom: 8px;
  }

  .page-desc {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .result-meta {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.75;
    margin-bottom: 14px;
    min-height: 18px;
  }

  /* ---------- 상황 태그 필터 바 ---------- */
  .tag-filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .tag-filter-chip {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border: 1.5px solid var(--pink);
    background: #fff;
    color: var(--warmgray);
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .tag-filter-chip.active {
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }

  /* ---------- 카드 안 상황 태그 편집 칩 ---------- */
  .tag-edit-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .tag-edit-chip {
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    border: 1.5px solid var(--pink);
    background: #fff;
    color: var(--warmgray);
    opacity: 0.6;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
  }

  .tag-edit-chip:hover { opacity: 0.85; }

  .tag-edit-chip.active {
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
    opacity: 1;
  }

  /* ---------- Card grid ---------- */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .place-card {
    position: relative;
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: 0 10px 26px -20px rgba(74, 63, 59, 0.4);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    padding-right: 30px;
  }

  .category-chip {
    background: var(--pink);
    color: var(--warmgray);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
  }

  .saved-date {
    font-size: 12px;
    opacity: 0.55;
    font-weight: 600;
  }

  .remove-x {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--cream);
    color: var(--warmgray);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .remove-x:hover {
    background: var(--coral);
    color: #fff;
    transform: rotate(90deg);
  }

  .remove-x:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .place-name {
    font-size: 17px;
    font-weight: 700;
  }

  .place-address {
    font-size: 13.5px;
    opacity: 0.85;
  }

  .place-category {
    font-size: 12.5px;
    opacity: 0.6;
  }

  .card-footer {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: 12.5px;
    border-top: 1px solid var(--cream);
    padding-top: 10px;
  }

  .place-link {
    text-decoration: none;
    font-weight: 700;
    color: var(--coral);
  }

  .place-link:hover { text-decoration: underline; }

  /* ---------- States ---------- */
  .state-msg {
    text-align: center;
    padding: 48px 20px;
    font-size: 14px;
    opacity: 0.7;
    background: #fff;
    border-radius: var(--radius-lg);
    line-height: 1.7;
  }

  .state-msg .btn-link {
    display: inline-block;
    margin-top: 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--coral);
    padding: 12px 24px;
    border-radius: var(--radius-md);
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .state-msg .btn-link:hover { transform: translateY(-2px); }

  /* ---------- Tablet (>=768px) ---------- */
  @media (min-width: 768px) {
    body { padding-bottom: 0; }
    .topbar-nav-link { display: inline-flex; align-items: center; }
    .bottom-tabbar { display: none; }

    main { padding: 32px 32px 100px; }

    .card-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
  }

  /* ---------- Desktop (>=1440px) ---------- */
  @media (min-width: 1440px) {
    main { padding: 40px 0 120px; }

    .card-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html">여기<span>찜</span></a>
    <div class="topbar-right">
      <div id="authArea"></div>
      <a class="topbar-nav-link primary" href="place-search.html">맛집 검색</a>
    </div>
  </header>

  <nav class="bottom-tabbar" aria-label="주요 기능 바로가기">
    <a class="tab-item" href="index.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>홈</span>
    </a>
    <a class="tab-item" href="place-search.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>맛집 검색</span>
    </a>
    <a class="tab-item active auth-required-link" href="Mypage.html" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.8-3-9-6.4-9-10.5C3 7.2 5.2 5 8 5c1.7 0 3.2.9 4 2.3C12.8 5.9 14.3 5 16 5c2.8 0 5 2.2 5 5.5 0 4.1-4.2 7.5-9 10.5z"/></svg>
      <span>맛집주머니</span>
    </a>
  </nav>

  <main>
    <h1 class="page-title heading">맛집주머니</h1>
    <p class="page-desc">내가 담은 맛집을 한눈에 모아봤어요.</p>

    <p class="state-msg" id="loginRequired" hidden>
      로그인 후 이용할 수 있어요.<br>오른쪽 위 로그인 버튼을 눌러주세요.
    </p>

    <section id="listWrap" hidden>
      <div class="tag-filter-bar" id="tagFilterBar" role="group" aria-label="상황 태그로 필터"></div>
      <p class="result-meta" id="resultMeta"></p>
      <div class="card-grid" id="cardGrid"></div>
      <p class="state-msg" id="emptyState" hidden>
        아직 담은 맛집이 없어요. 검색하러 가볼까요?<br>
        <a class="btn-link" href="place-search.html">맛집 검색하러 가기</a>
      </p>
      <p class="state-msg" id="filterEmptyState" hidden></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="auth-nav-toggle.js"></script>
  <script src="saved-places-store.js"></script>
  <script src="situation-tags.js"></script>
  <script src="Mypage.js"></script>
</body>
</html>
